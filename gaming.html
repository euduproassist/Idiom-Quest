<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Idiom Quest</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,body{
width:100%;
height:100%;
font-family:Arial,Helvetica,sans-serif;
overflow:hidden;
}

body{
position:relative;
}

.background{
position:fixed;
left:0;
top:0;
width:100%;
height:100%;
background:url("bg.png") center center/cover no-repeat;
z-index:-2;
}

.background::after{
content:"";
position:absolute;
left:0;
top:0;
width:100%;
height:100%;
background:rgba(0,0,0,.15);
}

.overlay{

width:min(100vw,600px);

height:100vh;

margin:auto;

display:flex;

flex-direction:column;

padding:18px;

gap:18px;

}

.topBar{

display:flex;

justify-content:space-between;

align-items:center;

}

.levelCard{

background:#556a23;

color:#fff;

font-weight:bold;

padding:15px 28px;

border-radius:18px;

font-size:clamp(18px,2vw,28px);

box-shadow:0 4px 10px rgba(0,0,0,.3);

}

.coinCard{

display:flex;

align-items:center;

background:#f5e7bf;

padding:10px 16px;

border-radius:20px;

gap:12px;

box-shadow:0 5px 10px rgba(0,0,0,.2);

}

.coinIcon{

font-size:28px;

}

#coins{

font-weight:bold;

font-size:30px;

color:#5d4215;

}

.plusBtn{

width:44px;

height:44px;

border:none;

border-radius:50%;

background:#6f8d34;

color:white;

font-size:28px;

cursor:pointer;

}

.settingsBtn{

width:62px;

height:62px;

border:none;

border-radius:50%;

background:#f5e7bf;

font-size:28px;

cursor:pointer;

box-shadow:0 5px 10px rgba(0,0,0,.25);

}

.videoCard{

background:#ead9b2;

border-radius:28px;

overflow:hidden;

box-shadow:0 10px 18px rgba(0,0,0,.25);

}

.titleRibbon{

display:inline-block;

background:#5d6d21;

color:white;

font-weight:bold;

padding:14px 28px;

font-size:28px;

border-radius:0 0 18px 0;

}

.videoHolder{

padding:18px;

}

#sceneVideo{

width:100%;

aspect-ratio:16/9;

border-radius:18px;

background:black;

object-fit:cover;

}

.questionCard{

background:#ead9b2;

border-radius:24px;

padding-bottom:25px;

box-shadow:0 10px 18px rgba(0,0,0,.25);

}

.answerSlots{

display:flex;

justify-content:center;

gap:25px;

padding:28px;

}

.word{

display:flex;

gap:8px;

position:relative;

padding-bottom:18px;

}

.slot{

width:52px;

height:52px;

background:#fff6dc;

border-radius:12px;

border:3px solid #cfb25e;

}

.underline{

position:absolute;

left:0;
bottom:0;

width:100%;

height:5px;

background:#b88d24;

border-radius:8px;

}

.lettersCard{

background:#ead9b2;

border-radius:24px;

padding-bottom:20px;

box-shadow:0 10px 18px rgba(0,0,0,.25);

}

#letterGrid{

padding:25px;

display:grid;

grid-template-columns:repeat(6,1fr);

gap:16px;

}

.letter{

height:68px;

border:none;

border-radius:16px;

background:#fff6dc;

font-size:34px;

font-weight:bold;

cursor:pointer;

box-shadow:0 4px 8px rgba(0,0,0,.2);

transition:.2s;

}

.letter:hover{

transform:scale(1.06);

}

.bottomButtons{

display:flex;

gap:18px;

}

.actionCard{

flex:1;

background:#ead9b2;

border:none;

border-radius:22px;

padding:18px;

display:flex;

gap:18px;

align-items:center;

box-shadow:0 8px 18px rgba(0,0,0,.25);

cursor:pointer;

}

.emoji{

font-size:48px;

}

.actionCard h3{

font-size:28px;

color:#4f611e;

}

.actionCard p{

font-size:18px;

color:#5f5f5f;

margin-top:6px;

}

.actionCard span{

display:block;

margin-top:10px;

font-size:24px;

font-weight:bold;

color:#a16d00;

}

@media(max-width:650px){

.overlay{

padding:10px;

gap:12px;

}

.titleRibbon{

font-size:20px;

}

.slot{

width:42px;

height:42px;

}

.letter{

height:58px;

font-size:28px;

}

.actionCard h3{

font-size:22px;

}

.actionCard p{

font-size:14px;

}

.emoji{

font-size:40px;

}

.levelCard{

font-size:18px;

padding:12px 20px;

}

#coins{

font-size:24px;

}

.settingsBtn{

width:50px;

height:50px;

font-size:24px;

}

}
</style>

</head>

<body>

<div class="background"></div>

<div class="overlay">

<!--========================
TOP BAR
=========================-->

<header class="topBar">

<div class="levelCard">
LEVEL 12
</div>

<div class="coinCard">

<div class="coinIcon">⭐</div>

<div id="coins">
250
</div>

<button class="plusBtn">
+
</button>

</div>

<button class="settingsBtn">
⚙
</button>

</header>

<!--========================
VIDEO CARD
=========================-->

<section class="videoCard">

<div class="titleRibbon">
WATCH THE SCENE
</div>

<div class="videoHolder">

<video
id="sceneVideo"
playsinline
webkit-playsinline
controls
preload="auto">

<source
src="break-ice.mp4"
type="video/mp4">

</video>

</div>

</section>

<!--========================
QUESTION CARD
=========================-->

<section class="questionCard">

<div class="titleRibbon">
WHAT IDIOM IS THIS?
</div>

<div
id="answerSlots"
class="answerSlots">

<div class="word">

<div class="slot"></div>
<div class="slot"></div>
<div class="slot"></div>
<div class="slot"></div>
<div class="underline"></div>

</div>

<div class="word">

<div class="slot"></div>
<div class="slot"></div>
<div class="slot"></div>
<div class="slot"></div>

<div class="underline"></div>

</div>

<div class="word">

<div class="slot"></div>
<div class="slot"></div>
<div class="slot"></div>

<div class="underline"></div>

</div>

</div>

</section>

<!--========================
LETTERS
=========================-->

<section class="lettersCard">

<div class="titleRibbon">

USE THESE LETTERS TO FORM THE ANSWER

</div>

<div id="letterGrid">

<button class="letter">
E
</button>

<button class="letter">
K
</button>

<button class="letter">
I
</button>

<button class="letter">
B
</button>

<button class="letter">
T
</button>

<button class="letter">
C
</button>

<button class="letter">
R
</button>

<button class="letter">
H
</button>

<button class="letter">
A
</button>

<button class="letter">
E
</button>

<button class="letter">
M
</button>

<button class="letter">
S
</button>

</div>

</section>

<!--========================
BOTTOM BUTTONS
=========================-->

<section class="bottomButtons">

<button
id="hintBtn"
class="actionCard">

<div class="emoji">
💡
</div>

<div>

<h3>
HINT
</h3>

<p>
Reveal random letter
</p>

<span>
⭐100
</span>

</div>

</button>

<button
id="revealBtn"
class="actionCard">

<div class="emoji">
🔍
</div>

<div>

<h3>
REVEAL
</h3>

<p>
Reveal chosen letter
</p>

<span>
⭐150
</span>

</div>

</button>

</section>

</div>

<script>
const video = document.getElementById("sceneVideo");

const letters = document.querySelectorAll(".letter");

const slots = document.querySelectorAll(".slot");

const hintBtn = document.getElementById("hintBtn");

const revealBtn = document.getElementById("revealBtn");

let currentSlot = 0;

let history = [];

const answer = "BREAK THE ICE";

video.volume = 1;

video.controls = true;

video.play().catch(() => {});

letters.forEach(btn=>{

btn.addEventListener("click",()=>{

if(currentSlot>=slots.length) return;

slots[currentSlot].textContent=btn.textContent;

slots[currentSlot].style.display="flex";

slots[currentSlot].style.alignItems="center";

slots[currentSlot].style.justifyContent="center";

slots[currentSlot].style.fontSize="30px";

slots[currentSlot].style.fontWeight="bold";

slots[currentSlot].style.color="#4d3d1b";

history.push({

slot:currentSlot,

button:btn

});

btn.disabled=true;

btn.style.visibility="hidden";

currentSlot++;

});

});

document.querySelectorAll(".slot").forEach((slot,index)=>{

slot.addEventListener("click",()=>{

if(slot.textContent==="") return;

const last=history.find(h=>h.slot===index);

if(last){

last.button.disabled=false;

last.button.style.visibility="visible";

}

slot.textContent="";

if(index<currentSlot){

currentSlot=index;

}

});

});

hintBtn.onclick=()=>{

let text=answer.replace(/ /g,"");

for(let i=0;i<slots.length;i++){

if(slots[i].textContent===""){

slots[i].textContent=text[i];

slots[i].style.display="flex";

slots[i].style.alignItems="center";

slots[i].style.justifyContent="center";

slots[i].style.fontWeight="bold";

slots[i].style.fontSize="30px";

slots[i].style.color="#4d3d1b";

currentSlot=i+1;

break;

}

}

};

revealBtn.onclick=()=>{

let text=answer.replace(/ /g,"");

for(let i=0;i<slots.length;i++){

slots[i].textContent=text[i];

slots[i].style.display="flex";

slots[i].style.alignItems="center";

slots[i].style.justifyContent="center";

slots[i].style.fontWeight="bold";

slots[i].style.fontSize="30px";

slots[i].style.color="#4d3d1b";

}

currentSlot=slots.length;

};

video.addEventListener("ended",()=>{

console.log("Video Finished");

});

document.addEventListener("keydown",(e)=>{

if(e.key==="Backspace"){

for(let i=slots.length-1;i>=0;i--){

if(slots[i].textContent!=""){

const btn=[...letters].find(b=>b.textContent===slots[i].textContent && b.style.visibility==="hidden");

if(btn){

btn.style.visibility="visible";

btn.disabled=false;

}

slots[i].textContent="";

currentSlot=i;

break;

}

}

}

});

window.addEventListener("resize",()=>{

document.documentElement.style.setProperty("--vh",window.innerHeight*0.01+"px");

});

document.documentElement.style.setProperty("--vh",window.innerHeight*0.01+"px");
</script>

</body>

</html>
