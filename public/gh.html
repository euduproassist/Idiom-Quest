<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Idiom Quest - Napo Studios</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            position: fixed;
            touch-action: none;
        }

        .screen-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
        }

        .game-canvas {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: fill;
            object-position: center;
            opacity: 0;
            transition: opacity 0.6s ease-in-out;
            pointer-events: none;
        }

        .game-canvas.active {
            opacity: 1;
            pointer-events: auto;
        }

        .loading-ui-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 22%;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease-in-out;
        }

        .loading-ui-layer.active {
            opacity: 1;
        }

        .loading-text {
            color: #1a365d;
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }

        .progress-bar-track {
            width: 52%;
            max-width: 320px;
            height: 10px;
            background-color: rgba(255, 255, 255, 0.45);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.15);
        }

        .progress-bar-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #3182ce, #63b3ed);
            border-radius: 8px;
            transition: width 0.1s linear;
        }

        .percentage-text {
            color: #1a365d;
            font-size: 1.15rem;
            font-weight: 700;
            margin-top: 10px;
        }

        .menu-ui-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 14%;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease-in-out;
        }

        .menu-ui-layer.active {
            opacity: 1;
            pointer-events: auto;
        }

        .play-hitbox {
            position: absolute;
            width: 44%;
            max-width: 270px;
            height: 8%;
            max-height: 65px;
            top: 55%;
            left: 50%;
            transform: translateX(-50%);
            cursor: pointer;
            border-radius: 35px;
        }

        .nav-icons-row {
            position: absolute;
            bottom: 18%;
            width: 65%;
            max-width: 400px;
            display: flex;
            justify-content: space-around;
        }

        .nav-hitbox {
            width: 28%;
            height: 60px;
            cursor: pointer;
        }

        /* --- Play Screen Layer Styles (Fixed for No Scroll) --- */
        .play-ui-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease-in-out;
            z-index: 10;
            padding: 10px;
        }

        .play-ui-layer.active {
            opacity: 1;
            pointer-events: auto;
        }

        .play-top-bar {
            width: 100%;
            max-width: 460px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            flex-shrink: 0;
        }

        .level-badge {
            background: #5a7c36;
            border: 2px solid #8ab054;
            color: #ffffff;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 0.9rem;
            letter-spacing: 1px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .coin-counter {
            background: #fef08a;
            border: 2px solid #eab308;
            padding: 2px 10px 2px 6px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 4px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .coin-counter span {
            font-weight: 800;
            color: #854d0e;
            font-size: 0.9rem;
        }

        .settings-gear-btn {
            width: 36px;
            height: 36px;
            background: #fef08a;
            border: 2px solid #eab308;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .scene-card {
            background: rgba(245, 235, 215, 0.9);
            border: 3px solid #b45309;
            border-radius: 20px;
            width: 100%;
            max-width: 460px;
            padding: 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            margin-bottom: 8px;
            flex-shrink: 1;
            display: flex;
            flex-direction: column;
        }

        .scene-title-bar {
            background: #78350f;
            color: #fef3c7;
            text-align: center;
            font-weight: 800;
            font-size: 0.85rem;
            padding: 4px;
            border-radius: 12px;
            margin-bottom: 6px;
            letter-spacing: 1px;
        }

        .video-container {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
        }

        .video-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .question-card {
            background: rgba(245, 235, 215, 0.9);
            border: 3px solid #b45309;
            border-radius: 20px;
            width: 100%;
            max-width: 460px;
            padding: 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            margin-bottom: 8px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .letter-slots-row {
            display: flex;
            justify-content: center;
            gap: 4px;
            flex-wrap: wrap;
            margin-bottom: 4px;
        }

        .letter-slot {
            width: 30px;
            height: 34px;
            background: #fff;
            border: 2px solid #b45309;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1rem;
            color: #78350f;
        }

        .keyboard-card {
            background: rgba(245, 235, 215, 0.9);
            border: 3px solid #b45309;
            border-radius: 20px;
            width: 100%;
            max-width: 460px;
            padding: 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            margin-bottom: 8px;
            flex-shrink: 0;
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 4px;
        }

        .key-tile {
            background: #fffbeb;
            border: 2px solid #d97706;
            border-radius: 6px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1rem;
            color: #78350f;
            cursor: pointer;
        }

        .actions-row {
            width: 100%;
            max-width: 460px;
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        .action-card {
            flex: 1;
            background: rgba(245, 235, 215, 0.9);
            border: 3px solid #b45309;
            border-radius: 16px;
            padding: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .action-card h4 {
            font-size: 0.85rem;
            color: #78350f;
            font-weight: 800;
        }

        .action-card p {
            font-size: 0.7rem;
            color: #92400e;
            font-weight: 700;
        }

        /* --- Store Screen Layer Styles (Untouched) --- */
        .store-ui-layer { position: absolute; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; opacity: 0; pointer-events: none; transition: opacity 0.5s ease-in-out; z-index: 10; }
        .store-ui-layer.active { opacity: 1; pointer-events: auto; }
        .store-header-title { position: absolute; top: 6.5%; font-size: 2.2rem; font-weight: 800; letter-spacing: 3px; color: #0b2545; text-align: center; }
        .store-close-btn { position: absolute; top: 6.8%; right: 6%; width: 38px; height: 38px; border: 2px solid #0b2545; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #0b2545; font-weight: bold; font-size: 1.2rem; background: rgba(255, 255, 255, 0.3); }
        .store-scroll-area { position: absolute; top: 14.5%; bottom: 3%; width: 90%; max-width: 460px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding-bottom: 20px; scrollbar-width: none; }
        .store-scroll-area::-webkit-scrollbar { display: none; }

        /* --- Settings Screen Layer Styles (Untouched) --- */
        .settings-ui-layer { position: absolute; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; opacity: 0; pointer-events: none; transition: opacity 0.5s ease-in-out; z-index: 10; }
        .settings-ui-layer.active { opacity: 1; pointer-events: auto; }
        .settings-header-title { position: absolute; top: 6.5%; font-size: 2.2rem; font-weight: 800; letter-spacing: 3px; color: #0b2545; text-align: center; }
        .settings-close-btn { position: absolute; top: 6.8%; right: 6%; width: 38px; height: 38px; border: 2px solid #0b2545; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #0b2545; font-weight: bold; font-size: 1.2rem; background: rgba(255, 255, 255, 0.3); }
        .settings-content-area { position: absolute; top: 15%; bottom: 4%; width: 90%; max-width: 460px; display: flex; flex-direction: column; align-items: center; }
        .settings-toggles-row { display: flex; justify-content: center; gap: 28px; margin-top: 20px; margin-bottom: 25px; width: 100%; }
        .setting-toggle-item { display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; }
        .setting-circle-btn { width: 78px; height: 78px; border-radius: 50%; background: #ffffff; box-shadow: 0 6px 15px rgba(11, 37, 69, 0.15); display: flex; align-items: center; justify-content: center; font-size: 1.8rem; border: none; position: relative; }
        .setting-circle-btn.active-sound { background: #48bb78; color: #ffffff; }
        .setting-circle-btn.inactive-sound { background: #ffffff; color: #1a365d; }
        .music-slash { position: absolute; width: 3px; height: 52px; background-color: #e53e3e; transform: rotate(45deg); border-radius: 2px; pointer-events: none; }
        .setting-label { font-size: 0.95rem; font-weight: 800; color: #0b2545; letter-spacing: 1px; }
        .settings-card { background: rgba(255, 255, 255, 0.78); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.6); border-radius: 22px; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 4px 15px rgba(11, 37, 69, 0.08); width: 100%; margin-bottom: 14px; cursor: pointer; }
        .settings-card-left { display: flex; align-items: center; gap: 16px; }
        .settings-icon-box { width: 48px; height: 48px; border-radius: 12px; color: #0b2545; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; }
        .settings-card-info h3 { font-size: 1.15rem; color: #0b2545; font-weight: 800; }
        .settings-card-info p { font-size: 0.9rem; color: #3182ce; font-weight: 700; }
        .settings-card-arrow { font-size: 1.4rem; color: #0b2545; font-weight: 800; }
        .settings-footer-links { position: absolute; bottom: 12px; width: 100%; display: flex; justify-content: space-around; font-size: 0.85rem; font-weight: 700; color: #ffffff; }
        .settings-footer-links span { cursor: pointer; }
        
        /* --- Shared Card/List Items (Untouched) --- */
        .section-header-container { display: flex; flex-direction: column; align-items: center; margin-top: 22px; margin-bottom: 10px; width: 100%; }
        .section-title { font-size: 1.4rem; font-weight: 800; letter-spacing: 2px; color: #0b2545; text-align: center; margin-bottom: 6px; }
        .section-divider-graphic { display: flex; align-items: center; justify-content: center; width: 80%; max-width: 280px; color: #0b2545; }
        .divider-line { flex-grow: 1; height: 1.5px; background: linear-gradient(90deg, transparent, #0b2545); }
        .divider-line.right { background: linear-gradient(90deg, #0b2545, transparent); }
        .divider-diamonds { display: flex; align-items: center; gap: 6px; margin: 0 10px; }
        .diamond-sm { width: 5px; height: 5px; background-color: #0b2545; transform: rotate(45deg); }
        .diamond-lg { width: 9px; height: 9px; background-color: #0b2545; transform: rotate(45deg); }
        .pass-card { background: rgba(255, 255, 255, 0.78); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.6); border-radius: 18px; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 4px 15px rgba(11, 37, 69, 0.08); }
        .pass-left { display: flex; align-items: center; gap: 14px; }
        .pass-icon-box { width: 52px; height: 52px; border: 2px solid #3182ce; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #1a365d; font-weight: 700; font-size: 1.1rem; background: rgba(49, 130, 206, 0.08); flex-shrink: 0; }
        .pass-icon-box img { width: 100%; height: 100%; object-fit: cover; }
        .calendar-icon { width: 44px; height: 44px; background: #ffffff; border: 2px solid #2b6cb0; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; position: relative; box-shadow: 0 2px 5px rgba(43, 108, 176, 0.2); flex-shrink: 0; }
        .calendar-header { position: absolute; top: 0; width: 100%; height: 12px; background: #2b6cb0; }
        .calendar-rings { position: absolute; top: -3px; width: 100%; display: flex; justify-content: space-around; padding: 0 8px; }
        .calendar-ring { width: 3px; height: 6px; background: #ffffff; border-radius: 2px; border: 1px solid #1a365d; }
        .calendar-body { font-size: 1.05rem; font-weight: 900; color: #1a365d; margin-bottom: 3px; }
        .pass-info h3 { font-size: 1.05rem; color: #0b2545; margin-bottom: 4px; font-weight: 700; }
        .pass-perks { display: flex; flex-direction: column; gap: 2px; }
        .perk-item { font-size: 0.75rem; color: #1a365d; display: flex; align-items: center; gap: 4px; }
        .perk-item span { color: #2b6cb0; font-weight: bold; }
        .pass-right { display: flex; flex-direction: column; align-items: flex-end; justify-content: center; flex-shrink: 0; gap: 4px; }
        .pass-price { font-size: 1.15rem; font-weight: 800; color: #0b2545; }
        .pass-total { font-size: 0.68rem; color: #4a5568; text-align: right; margin-bottom: 4px; font-weight: 600; }
        .buy-btn { background: rgba(220, 245, 225, 0.9); border: 1.5px solid #38a169; color: #22543d; padding: 6px 20px; border-radius: 16px; font-weight: 700; font-size: 0.85rem; cursor: pointer; box-shadow: 0 2px 5px rgba(56, 161, 105, 0.2); }
        .store-footer-banner { background: rgba(255, 255, 255, 0.82); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.6); border-radius: 16px; padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 4px 15px rgba(11, 37, 69, 0.08); margin-top: 14px; }
        .banner-item { display: flex; align-items: center; gap: 8px; font-size: 0.75rem; color: #1a365d; font-weight: 600; }
        .banner-divider { width: 1px; height: 24px; background-color: rgba(11, 37, 69, 0.2); }
    </style>
</head>
<body>

    <div class="screen-container" id="appContainer">
        <img src="../assets/logo.png" alt="Napo Studios Logo" class="game-canvas active" id="screenLogo">

        <img src="../assets/loading_bg.png" alt="Loading Background" class="game-canvas" id="screenLoadingBg">
        
        <div class="loading-ui-layer" id="loadingUi">
            <div class="loading-text" id="loadingText">Loading...</div>
            <div class="progress-bar-track">
                <div class="progress-bar-fill" id="progressBarFill"></div>
            </div>
            <div class="percentage-text" id="percentageText">0%</div>
        </div>

        <img src="../assets/menu_bg.png" alt="Menu Background" class="game-canvas" id="screenMenuBg">
        
        <div class="menu-ui-layer" id="menuUi">
            <div class="play-hitbox" onclick="handleMenuAction('play')"></div>
            <div class="nav-icons-row">
                <div class="nav-hitbox" onclick="handleMenuAction('progress')"></div>
                <div class="nav-hitbox" onclick="handleMenuAction('store')"></div>
                <div class="nav-hitbox" onclick="handleMenuAction('settings')"></div>
            </div>
        </div>

        <img src="../assets/bg.png" alt="Play Screen Background" class="game-canvas" id="screenPlayBg">

        <div class="play-ui-layer" id="playUi">
            <div class="play-top-bar">
                <div class="level-badge">LEVEL 12</div>
                <div class="coin-counter">
                    <span style="font-size: 0.9rem;">🪙</span>
                    <span>250</span>
                </div>
                <div class="settings-gear-btn" onclick="openSettings()">⚙️</div>
            </div>

            <div class="scene-card">
                <div class="scene-title-bar">WATCH THE SCENE</div>
                <div class="video-container">
                    <iframe src="your link goes here" title="YouTube video player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                </div>
            </div>

            <div class="question-card">
                <div class="scene-title-bar" style="width: 100%;">WHAT IDIOM IS THIS?</div>
                <div class="letter-slots-row">
                    <div class="letter-slot"></div><div class="letter-slot"></div><div class="letter-slot"></div>
                </div>
                <div class="letter-slots-row">
                    <div class="letter-slot"></div><div class="letter-slot"></div><div class="letter-slot"></div><div class="letter-slot"></div>
                </div>
                <div class="letter-slots-row">
                    <div class="letter-slot"></div><div class="letter-slot"></div><div class="letter-slot"></div>
                </div>
            </div>

            <div class="keyboard-card">
                <div class="key-tile">E</div><div class="key-tile">K</div><div class="key-tile">I</div><div class="key-tile">B</div><div class="key-tile">T</div><div class="key-tile">C</div>
                <div class="key-tile">R</div><div class="key-tile">H</div><div class="key-tile">A</div><div class="key-tile">E</div><div class="key-tile">M</div><div class="key-tile">S</div>
            </div>

            <div class="actions-row">
                <div class="action-card" onclick="alert('Hint clicked!')">
                    <div style="font-size: 1.2rem;">💡</div>
                    <h4>HINT</h4>
                    <p>🪙 100</p>
                </div>
                <div class="action-card" onclick="alert('Reveal clicked!')">
                    <div style="font-size: 1.2rem;">🔍</div>
                    <h4>REVEAL</h4>
                    <p>🪙 150</p>
                </div>
            </div>
        </div>

        <img src="../assets/background.png" alt="Store Background" class="game-canvas" id="screenStoreBg">

        <div class="store-ui-layer" id="storeUi">
            <div class="store-header-title">STORE</div>
            <div class="store-close-btn" onclick="closeStore()">✕</div>
            <div class="store-scroll-area">
                <!-- Store content unchanged -->
            </div>
        </div>

        <img src="../assets/background.png" alt="Settings Background" class="game-canvas" id="screenSettingsBg">

        <div class="settings-ui-layer" id="settingsUi">
            <div class="settings-header-title">SETTINGS</div>
            <div class="settings-close-btn" onclick="closeSettings()">✕</div>
            <div class="settings-content-area">
                <!-- Settings content unchanged -->
            </div>
        </div>
    </div>

    <script>
        function lockPortraitOrientation() {
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('portrait').catch(() => {});
            }
        }
        window.addEventListener('load', () => { lockPortraitOrientation(); startSequence(); });
        window.addEventListener('orientationchange', () => { lockPortraitOrientation(); });

        function startSequence() { setTimeout(() => { transitionToLoadingScreen(); }, 3000); }
        function transitionToLoadingScreen() {
            const logoScreen = document.getElementById('screenLogo');
            const loadingBg = document.getElementById('screenLoadingBg');
            const loadingUi = document.getElementById('loadingUi');
            logoScreen.classList.remove('active');
            loadingBg.classList.add('active');
            loadingUi.classList.add('active');
            runLoadingSequence();
        }
        function runLoadingSequence() {
            let currentProgress = 0;
            const fillElement = document.getElementById('progressBarFill');
            const percentageElement = document.getElementById('percentageText');
            const textElement = document.getElementById('loadingText');
            let dotCounter = 0;
            const textInterval = setInterval(() => { dotCounter = (dotCounter % 3) + 1; textElement.textContent = "Loading" + ".".repeat(dotCounter); }, 400);
            const totalDuration = 2500; 
            const intervalStep = 25;
            const incrementAmount = 100 / (totalDuration / intervalStep);
            const progressInterval = setInterval(() => {
                currentProgress += incrementAmount;
                if (currentProgress >= 100) {
                    currentProgress = 100;
                    clearInterval(progressInterval); clearInterval(textInterval);
                    setTimeout(transitionToMenuScreen, 350);
                }
                const roundedProgress = Math.floor(currentProgress);
                fillElement.style.width = roundedProgress + '%';
                percentageElement.textContent = roundedProgress + '%';
            }, intervalStep);
        }
        function transitionToMenuScreen() {
            const loadingBg = document.getElementById('screenLoadingBg');
            const loadingUi = document.getElementById('loadingUi');
            const menuBg = document.getElementById('screenMenuBg');
            const menuUi = document.getElementById('menuUi');
            loadingBg.classList.remove('active');
            loadingUi.classList.remove('active');
            menuBg.classList.add('active');
            menuUi.classList.add('active');
        }

        let isPlayOpen = false, isStoreOpen = false, isSettingsOpen = false;
        function handleMenuAction(actionType) {
            if (actionType === 'play') openPlay();
            else if (actionType === 'store') openStore();
            else if (actionType === 'settings') openSettings();
        }
        function openPlay() {
            isPlayOpen = true;
            document.getElementById('screenMenuBg').classList.remove('active');
            document.getElementById('menuUi').classList.remove('active');
            document.getElementById('screenPlayBg').classList.add('active');
            document.getElementById('playUi').classList.add('active');
            history.pushState({ page: 'play' }, '', '');
        }
        function openStore() {
            isStoreOpen = true;
            document.getElementById('screenMenuBg').classList.remove('active');
            document.getElementById('menuUi').classList.remove('active');
            document.getElementById('screenStoreBg').classList.add('active');
            document.getElementById('storeUi').classList.add('active');
            history.pushState({ page: 'store' }, '', '');
        }
        function closeStore() {
            if (!isStoreOpen) return;
            isStoreOpen = false;
            document.getElementById('screenStoreBg').classList.remove('active');
            document.getElementById('storeUi').classList.remove('active');
            document.getElementById('screenMenuBg').classList.add('active');
            document.getElementById('menuUi').classList.add('active');
            if (history.state && history.state.page === 'store') history.back();
        }
        function openSettings() {
            isSettingsOpen = true;
            document.getElementById('screenMenuBg').classList.remove('active');
            document.getElementById('menuUi').classList.remove('active');
            document.getElementById('screenPlayBg').classList.remove('active');
            document.getElementById('playUi').classList.remove('active');
            document.getElementById('screenSettingsBg').classList.add('active');
            document.getElementById('settingsUi').classList.add('active');
            history.pushState({ page: 'settings' }, '', '');
        }
        function closeSettings() {
            if (!isSettingsOpen) return;
            isSettingsOpen = false;
            document.getElementById('screenSettingsBg').classList.remove('active');
            document.getElementById('settingsUi').classList.remove('active');
            document.getElementById('screenMenuBg').classList.add('active');
            document.getElementById('menuUi').classList.add('active');
            if (history.state && history.state.page === 'settings') history.back();
        }

        window.addEventListener('popstate', () => {
            if (isPlayOpen) { isPlayOpen = false; document.getElementById('screenPlayBg').classList.remove('active'); document.getElementById('playUi').classList.remove('active'); document.getElementById('screenMenuBg').classList.add('active'); document.getElementById('menuUi').classList.add('active'); }
            else if (isStoreOpen) { isStoreOpen = false; document.getElementById('screenStoreBg').classList.remove('active'); document.getElementById('storeUi').classList.remove('active'); document.getElementById('screenMenuBg').classList.add('active'); document.getElementById('menuUi').classList.add('active'); }
            else if (isSettingsOpen) { isSettingsOpen = false; document.getElementById('screenSettingsBg').classList.remove('active'); document.getElementById('settingsUi').classList.remove('active'); document.getElementById('screenMenuBg').classList.add('active'); document.getElementById('menuUi').classList.add('active'); }
        });
    </script>
</body>
</html>
