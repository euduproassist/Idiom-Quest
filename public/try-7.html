<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Idiom Quest - Napo Studios</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            /* Extra safeguard against auto-rotation behaviors on mobile wrappers */
            position: fixed;
            touch-action: none;
        }

        /* Screen container locked to portrait aspect ratios & centering */
        .screen-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
        }

        /* Enforce full screen stretching (object-fit: fill) */
        .game-canvas {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: fill;
            object-position: center;
            opacity: 0;
            transition: opacity 0.6s ease-in-out;
            pointer-events: none;
        }

        .game-canvas.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* Logo screen specific background styling */
        #logo-screen {
            background-color: #000000;
        }

        /* Loading UI Overlays matching exact visual placement */
        .loading-ui-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 22%; /* Positioned precisely over the water/dock area */
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease-in-out;
        }

        .loading-ui-layer.active {
            opacity: 1;
        }

        .loading-text {
            color: #1a365d;
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }

        .progress-bar-track {
            width: 52%;
            max-width: 320px;
            height: 10px;
            background-color: rgba(255, 255, 255, 0.45);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.15);
        }

        .progress-bar-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #3182ce, #63b3ed);
            border-radius: 8px;
            transition: width 0.1s linear;
        }

        .percentage-text {
            color: #1a365d;
            font-size: 1.15rem;
            font-weight: 700;
            margin-top: 10px;
        }

        /* Interactive Menu Overlay elements for buttons */
        .menu-ui-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 14%;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease-in-out;
        }

        .menu-ui-layer.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* Transparent interactive zones matching visual layout positions */
        .play-hitbox {
            position: absolute;
            width: 44%;
            max-width: 270px;
            height: 8%;
            max-height: 65px;
            top: 55%; /* Matches button location on menu graphic */
            left: 50%;
            transform: translateX(-50%);
            cursor: pointer;
            border-radius: 35px;
        }

        .nav-icons-row {
            position: absolute;
            bottom: 18%;
            width: 65%;
            max-width: 400px;
            display: flex;
            justify-content: space-around;
        }

        .nav-hitbox {
            width: 28%;
            height: 60px;
            cursor: pointer;
        }

        /* Store Vertical Pages Container (Coin and Tiers view stack) */
        .store-stack-container {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s ease-in-out;
            z-index: 10;
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .store-stack-container::-webkit-scrollbar {
            display: none;
        }

        .store-stack-container.active {
            opacity: 1;
            pointer-events: auto;
        }

        .store-page-pane {
            width: 100%;
            height: 100%;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            position: relative;
            overflow: hidden;
        }

        .store-page-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: fill;
            object-position: center;
        }

        /* Seamless background transition layer to blend cards during scroll */
        .store-blend-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 25%;
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0), rgba(220, 235, 248, 0.85));
            pointer-events: none;
            z-index: 2;
        }

        /* Close / Back button hitbox aligned precisely over the 'X' icon graphic with a slight right shift */
        .store-close-hitbox {
            position: absolute;
            top: 4.5%;
            right: 4.2%;
            width: 12%;
            max-width: 55px;
            height: 7%;
            max-height: 55px;
            cursor: pointer;
            border-radius: 50%;
            z-index: 5;
        }
    </style>
</head>
<body>

    <div class="screen-container" id="appContainer">
        <!-- 1st Photo: Logo Screen -->
        <img src="../assets/logo.png" alt="Napo Studios Logo" class="game-canvas active" id="screenLogo">

        <!-- 2nd Photo: Loading Screen Background -->
        <img src="../assets/loading_bg.png" alt="Loading Background" class="game-canvas" id="screenLoadingBg">
        
        <!-- Loading UI Elements (Percentage, Loading text, Progress bar) -->
        <div class="loading-ui-layer" id="loadingUi">
            <div class="loading-text" id="loadingText">Loading...</div>
            <div class="progress-bar-track">
                <div class="progress-bar-fill" id="progressBarFill"></div>
            </div>
            <div class="percentage-text" id="percentageText">0%</div>
        </div>

        <!-- 3rd Photo: Menu Screen Background & Interactive Layer -->
        <img src="../assets/menu_bg.png" alt="Menu Background" class="game-canvas" id="screenMenuBg">
        
        <div class="menu-ui-layer" id="menuUi">
            <div class="play-hitbox" onclick="handleMenuAction('play')"></div>
            <div class="nav-icons-row">
                <div class="nav-hitbox" onclick="handleMenuAction('progress')"></div>
                <div class="nav-hitbox" onclick="handleMenuAction('store')"></div>
                <div class="nav-hitbox" onclick="handleMenuAction('settings')"></div>
            </div>
        </div>

        <!-- Store Stack Flow Pages (Coin Pack Page & Tiers Pass Page) -->
        <div class="store-stack-container" id="storeStackContainer">
            <!-- Store Page 1: Coin Packs (coin_bg.png) -->
            <div class="store-page-pane" id="storePageCoin">
                <img src="../assets/coin_bg.png" alt="Coin Store Background" class="store-page-bg">
                <div class="store-blend-overlay"></div>
                <div class="store-close-hitbox" onclick="closeStorePages()"></div>
            </div>
            <!-- Store Page 2: Tiers Passes (tiers_bg.png) -->
            <div class="store-page-pane" id="storePageTiers">
                <img src="../assets/tiers_bg.png" alt="Tiers Store Background" class="store-page-bg">
                <div class="store-close-hitbox" onclick="closeStorePages()"></div>
            </div>
        </div>
    </div>

    <script>
        // Force and lock orientation to portrait where supported permanently
        function lockPortraitOrientation() {
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('portrait').catch(() => {});
            }
        }

        window.addEventListener('load', () => {
            lockPortraitOrientation();
            startSequence();
        });

        // Continuous enforcement event listeners to block physical rotation flips
        window.addEventListener('orientationchange', () => {
            lockPortraitOrientation();
        });

        function startSequence() {
            // Step 1: Logo is displayed first for exactly 3 seconds
            setTimeout(() => {
                transitionToLoadingScreen();
            }, 3000);
        }

        function transitionToLoadingScreen() {
            const logoScreen = document.getElementById('screenLogo');
            const loadingBg = document.getElementById('screenLoadingBg');
            const loadingUi = document.getElementById('loadingUi');

            // Smooth crossfade switch
            logoScreen.classList.remove('active');
            loadingBg.classList.add('active');
            loadingUi.classList.add('active');

            runLoadingSequence();
        }

        function runLoadingSequence() {
            let currentProgress = 0;
            const fillElement = document.getElementById('progressBarFill');
            const percentageElement = document.getElementById('percentageText');
            const textElement = document.getElementById('loadingText');

            // Loading text animation configuration ("loading." -> "loading.." -> "loading...")
            let dotCounter = 0;
            const textInterval = setInterval(() => {
                dotCounter = (dotCounter % 3) + 1;
                textElement.textContent = "Loading" + ".".repeat(dotCounter);
            }, 400);

            // Progress counter simulation spanning ~2.5 seconds for a smooth game feel
            const totalDuration = 2500; 
            const intervalStep = 25;
            const incrementAmount = 100 / (totalDuration / intervalStep);

            const progressInterval = setInterval(() => {
                currentProgress += incrementAmount;
                if (currentProgress >= 100) {
                    currentProgress = 100;
                    clearInterval(progressInterval);
                    clearInterval(textInterval);
                    
                    // Brief pause at 100% before transitioning smoothly to the menu
                    setTimeout(transitionToMenuScreen, 350);
                }

                const roundedProgress = Math.floor(currentProgress);
                fillElement.style.width = roundedProgress + '%';
                percentageElement.textContent = roundedProgress + '%';
            }, intervalStep);
        }

        function transitionToMenuScreen() {
            const loadingBg = document.getElementById('screenLoadingBg');
            const loadingUi = document.getElementById('loadingUi');
            const menuBg = document.getElementById('screenMenuBg');
            const menuUi = document.getElementById('menuUi');

            // Fade out loading assets, fade in final menu assets seamlessly
            loadingBg.classList.remove('active');
            loadingUi.classList.remove('active');

            menuBg.classList.add('active');
            menuUi.classList.add('active');
        }

        // Global state to track active sub-flows for browser history / back button integration
        let isStoreOpen = false;

        // Placeholder handler for menu button actions
        function handleMenuAction(actionType) {
            console.log("Menu action triggered:", actionType);
            if (actionType === 'store') {
                openStoreFlow();
            }
        }

        function openStoreFlow() {
            const menuBg = document.getElementById('screenMenuBg');
            const menuUi = document.getElementById('menuUi');
            const storeContainer = document.getElementById('storeStackContainer');
            const coinPage = document.getElementById('storePageCoin');

            // Push history state to capture device back-button events
            history.pushState({ page: 'store' }, '', '');
            isStoreOpen = true;

            // Step A: Trigger standard game page-switch transition
            menuBg.classList.remove('active');
            menuUi.classList.remove('active');

            storeContainer.classList.add('active');
            coinPage.scrollIntoView({ behavior: 'instant' });

            // Step B: Automatically swipe up to tiers page after 1.5 seconds
            setTimeout(() => {
                if (isStoreOpen) {
                    const tiersPage = document.getElementById('storePageTiers');
                    tiersPage.scrollIntoView({ behavior: 'smooth' });
                }
            }, 1500);
        }

        function closeStorePages() {
            if (!isStoreOpen) return;
            isStoreOpen = false;

            const storeContainer = document.getElementById('storeStackContainer');
            const menuBg = document.getElementById('screenMenuBg');
            const menuUi = document.getElementById('menuUi');

            storeContainer.classList.remove('active');
            menuBg.classList.add('active');
            menuUi.classList.add('active');

            // Clear history state if popped manually via button
            if (history.state && history.state.page === 'store') {
                history.back();
            }
        }

        // Handle native/built-in device back button navigation
        window.addEventListener('popstate', (event) => {
            if (isStoreOpen) {
                isStoreOpen = false;
                const storeContainer = document.getElementById('storeStackContainer');
                const menuBg = document.getElementById('screenMenuBg');
                const menuUi = document.getElementById('menuUi');

                storeContainer.classList.remove('active');
                menuBg.classList.add('active');
                menuUi.classList.add('active');
            }
        });
    </script>
</body>
</html>
