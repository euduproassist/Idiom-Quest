<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KE SKOBO</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            text-align: center;
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        h1 {
            font-size: 3.5rem;
            letter-spacing: 4px;
            margin-bottom: 50px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }

        .button-group {
            display: flex;
            gap: 40px;
            position: relative;
            align-items: center;
            justify-content: center;
            min-height: 80px;
        }

        button {
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s ease, background-color 0.2s ease;
            letter-spacing: 2px;
        }

        #true-btn {
            background-color: #2ecc71;
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(46, 204, 113, 0.4);
        }

        #true-btn:hover {
            background-color: #27ae60;
            transform: scale(1.05);
        }

        #false-btn {
            background-color: #e74c3c;
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(231, 76, 60, 0.4);
            position: absolute;
            left: 120px;
        }

        .message-box {
            display: none;
            animation: fadeIn 0.5s ease-in-out;
            max-width: 600px;
            padding: 40px;
            border: 2px solid #2ecc71;
            border-radius: 15px;
            background: linear-gradient(135deg, #111111, #1a2f1a);
            box-shadow: 0 0 30px rgba(46, 204, 113, 0.3);
        }

        .message-box h2 {
            color: #2ecc71;
            font-size: 2.5rem;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(46, 204, 113, 0.5);
        }

        .message-box p {
            color: #dddddd;
            font-size: 1.1rem;
            line-height: 1.6;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Main Quiz View -->
        <div id="quiz-view">
            <h1>KE SKOBO</h1>
            <div class="button-group" id="btn-container">
                <button id="true-btn" onclick="handleTrue()">TRUE</button>
                <button id="false-btn" onmouseover="moveButton()" onclick="moveButton()">FALSE</button>
            </div>
        </div>

        <!-- Success Message View -->
        <div id="message-view" class="message-box">
            <h2>THANK YOU FOR YOUR HONESTY</h2>
            <p>Your integrity has been successfully verified. Welcome back to the absolute truth.</p>
        </div>
    </div>

    <script>
        const falseBtn = document.getElementById('false-btn');
        const quizView = document.getElementById('quiz-view');
        const messageView = document.getElementById('message-view');

        function moveButton() {
            // Calculate random positions within the visible window bounds
            const padding = 100;
            const maxX = window.innerWidth - falseBtn.offsetWidth - padding;
            const maxY = window.innerHeight - falseBtn.offsetHeight - padding;
            
            const randomX = Math.floor(Math.random() * (maxX - padding)) + padding;
            const randomY = Math.floor(Math.random() * (maxY - padding)) + padding;

            falseBtn.style.position = 'fixed';
            falseBtn.style.left = randomX + 'px';
            falseBtn.style.top = randomY + 'px';
        }

        function handleTrue() {
            // Hide quiz elements and show decorated success message
            quizView.style.display = 'none';
            messageView.style.display = 'block';

            // After 3 seconds, reset back to the original page layout
            setTimeout(() => {
                messageView.style.display = 'none';
                quizView.style.display = 'block';
                
                // Reset FALSE button position back to standard layout
                falseBtn.style.position = 'absolute';
                falseBtn.style.left = '120px';
                falseBtn.style.top = 'auto';
            }, 3000);
        }
    </script>
</body>
</html>
